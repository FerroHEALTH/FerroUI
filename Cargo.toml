[workspace]
resolver = "3"
members = ["crates/*", "app/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroUI"
homepage = "https://github.com/FerroHEALTH/FerroUI"
authors = ["Ruben Talstra"]
# The gallery is never published; crates/ferrohealth-ui sets publish = true.
publish = false

# The authoritative third-party set. A crate takes a dependency with
# dep.workspace = true, and every version is checked against crates.io on the
# day it is added (.claude/rules/reliability.md). The Leptos line is the one
# the four FerroHEALTH consoles resolve, so the library adds no second copy to
# any of them. Verified against crates.io on 2026-10-18.
[workspace.dependencies]
leptos = { version = "0.8.22", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
leptos_meta = { version = "0.8.7", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# The catalogs of the strings the components draw: Project Fluent's message
# format, the catalogs embedded at build time from the `locales/` directory
# (the `walkdir` reader of its macro), no runtime file reader. Verified
# against crates.io on 2026-10-19.
fluent-templates = { version = "0.15.1", default-features = false, features = ["macros", "walkdir"] }
# The language a Fluent bundle formats a number in, which the library's
# number formatter reads (`ferrohealth_ui::i18n::format_number`). In the lock
# already under fluent-templates. Verified against crates.io on 2026-10-22.
intl-memoizer = "0.5.3"
# The gallery app alone: its server half and its browser half. The
# wasm-bindgen CLI of the gallery build equals the wasm-bindgen crate version
# (scripts/release/gallery-tools.sh); the library itself never pins it, and
# asks for its own floors of web-sys and wasm-bindgen-futures.
leptos_axum = "0.8.10"
wasm-bindgen = "0.2.129"
console_error_panic_hook = "0.1.7"
# The gallery's browser APIs that Leptos turns on no feature for (the theme
# toggle's post in place), and the future of a browser promise. Both are in
# the lock already under Leptos.
web-sys = { version = "0.3.106", default-features = false }
wasm-bindgen-futures = "0.4.79"
axum = "0.8.9"
http = "1.5.0"
tokio = { version = "1.53.1", default-features = false }
tower = "0.5.3"
tower-http = { version = "0.7.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
serde_json = "1.0.151"
# Test-only: the server's shared context, which an island with children
# needs to render to HTML in a test as it does in a page. In the lock
# already under Leptos.
hydration_context = { version = "0.3.2", default-features = false }
# Test-only: the gallery's browser journeys, a WebDriver client in Rust over
# chromedriver with the Chrome DevTools Protocol for the window size, the
# colour scheme and the painted colours.
thirtyfour = { version = "0.37.5", default-features = false, features = ["reqwest", "cdp"] }
# The process-group kill that stops a journey's chromedriver with every
# Chrome it started.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

# The reliability bar (no specification governs it: our own design), the
# FerroHEALTH family's lint set as FerroBRIDGE and FerroFED carry it.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 and RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

# A clean 500 relies on catch_unwind, which only catches unwinding panics, and
# tests ignore the panic setting, so abort would be untestable
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"

# The gallery's WebAssembly bundle, built by cargo-leptos: optimized for size,
# as each console builds its own (the Cargo reference, profiles; no
# specification governs this: our own design).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
debug = false

# The gallery's WebAssembly for local journeys (scripts/fast.sh): the
# release settings without the size optimization, LTO or wasm-opt pass, so
# it builds quickly and hydrates like the release bundle. CI, the release
# and the bundle budget build wasm-release alone (no specification governs
# this: our own design).
[profile.wasm-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
debug = false
