# Each browser journey starts its own Chrome and its own gallery, so at most
# four run at once: more crash the browser on a laptop or a CI runner.
# https://nexte.st/docs/configuration/test-groups/
[test-groups]
browser = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(ferrohealth-ui-gallery) & (test(/^dates::/) | test(/^journeys::/) | test(/^keys::/) | test(/^menus::/) | test(/^no_wasm::/) | test(/^painted::/) | test(/^screenshots::(every_page|one_brand)/) | test(/^states::/) | test(/^tabs_and_toasts::/) | test(/^widgets::/))'
test-group = 'browser'
