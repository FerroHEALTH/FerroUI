# CI in three tiers (no specification governs this: our own design).
#
#   1. The workflow, shell and guard tier needs no Rust and runs on every
#      change.
#   2. The Rust tier runs when the workspace exists (the `detect` job looks
#      for the root Cargo.toml after checkout, which hashFiles() at `if:` time
#      cannot): fmt, clippy on the host and on wasm32, nextest with the
#      contrast test, rustdoc, cargo-deny, the publish dry run.
#   3. The gallery tier runs when the change reaches the gallery: the release
#      site bundle with its size budget and path check, then the browser
#      journeys and the screenshot capture in Chrome for Testing.
#   4. The design tier builds the console design library's pages (design/)
#      and runs its checks in headless Chrome, one job per design set the
#      change reaches.
#
# What a change reaches is scripts/checks/affected.sh's answer over the
# paths it touches (the `detect` job); a push to main and a manual run reach
# everything. A merge-group run leaves out the per-file lints (zizmor,
# actionlint, shellcheck, comment-style, todo-issues, rustfmt, lucide,
# design-licence): a pull request enters the queue only with `conclusion`
# green on its head, and the push to main runs them again over the merged
# tree. Every job that builds, tests or renders the merged tree runs in the
# queue.
#
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited` started a second run on the same commit, the
    # concurrency group cancelled the first, and its `conclusion` reported a
    # failure on the head commit (#377). The guards read their labels and the
    # description from the API when they run, and pr-guards.yml re-runs the
    # one a change affects once this run completes.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Tier 1 ---------------------------------------------------------------
  workflow-audit:
    name: zizmor
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.31.1
      - name: Audit .github
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  workflow-lint:
    name: actionlint
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  shellcheck:
    name: shellcheck
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        run: bash scripts/release/milestone.sh --self-test
      - name: The crate version guard reads files past the pipe buffer and refuses a missing section
        run: bash scripts/checks/crate-version-guard.sh --self-test
      - name: The change classifier, the local gate and the Chrome lock pass their self-tests
        run: |
          bash scripts/checks/affected.sh --self-test
          bash scripts/fast.sh --self-test
          bash scripts/chrome-lock.sh --self-test

  comment-style:
    name: comment-style
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # No string a reader sees in a component outside the catalogs
  # (.claude/rules/leptos-ui.md §13).
  stray-literals:
    name: stray-literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/stray-literals.sh crates/ferrohealth-ui/src app/ferrohealth-ui-gallery/src

  # The mechanical part of the Leptos rules (.claude/rules/leptos-ui.md
  # §14 and §15), with its self-test.
  leptos-rules:
    name: leptos-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/leptos-rules.sh --self-test
      - run: bash scripts/checks/leptos-rules.sh

  # Every TODO(#N) names an open issue.
  todo-issues:
    name: todo-issues
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pending-work pointer names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh

  # The guards that keep parallel pull requests off each other's lines (no
  # specification governs them: our own design): every changelog fragment is
  # well formed and every module list is alphabetical. On a pull request, the
  # change adds a fragment and leaves [Unreleased] alone (`no-changelog`
  # waives the fragment), and commits no screenshot unless it is the refresh
  # pull request. Labels are read when the job runs, and pr-guards.yml re-runs
  # the job when `no-changelog` is added or removed (#377).
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The guards prove themselves over stub repositories
        run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
          bash scripts/checks/changelog-security.sh --self-test
          bash scripts/release/plan.sh --self-test
          bash scripts/checks/screenshot-paths.sh --self-test
          bash scripts/checks/mod-order.sh --self-test
      - run: bash scripts/release/changelog.sh --check
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8), on the
      # fragments assembled as the next release will carry them: every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason. The
      # release plan runs the same checks over the section it cuts.
      - name: The changelog the next release carries holds its structure and Security rules
        run: bash scripts/checks/changelog-unreleased.sh
      - run: bash scripts/checks/mod-order.sh
      - name: The pull request adds a fragment and commits no screenshot
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
          flag=()
          if grep -qx 'no-changelog' <<<"$labels"; then flag=(--no-changelog); fi
          bash scripts/checks/changelog-guard.sh "${flag[@]}" "$BASE" "$HEAD"
          if [ "$HEAD_REF" = "chore/screenshots" ] || grep -qx 'screenshots' <<<"$labels"; then
            echo "the refresh pull request: the screenshot guard runs in the test job"
          else
            bash scripts/checks/screenshot-paths.sh "$BASE" "$HEAD"
          fi

  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the
  # template's checkbox. Bots are skipped: a bot cannot accept terms. The
  # body is read when the step runs, and pr-guards.yml re-runs this job when
  # the description changes, so ticking the box takes effect (#377).
  contribution-licence:
    name: contribution-licence
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the description when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_BODY=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq '.body // ""')
          export PR_BODY
          bash scripts/checks/contribution-licence.sh

  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.find.outputs.cargo }}
      gallery: ${{ steps.find.outputs.gallery }}
      design: ${{ steps.find.outputs.design }}
    steps:
      # Two commits: a pull request's checkout is its merge commit, whose
      # first parent is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
              ;;
            merge_group)
              # The compare API lists at most 300 files; a longer list reaches everything.
              gh api "repos/$GH_REPO/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq '.files[].filename' > "$RUNNER_TEMP/changed"
              ;;
          esac
          if [ -f "$RUNNER_TEMP/changed" ] && [ "$(wc -l < "$RUNNER_TEMP/changed")" -lt 300 ]; then
            echo "changed paths:"
            sed 's/^/  /' "$RUNNER_TEMP/changed"
            plan="$(bash scripts/checks/affected.sh < "$RUNNER_TEMP/changed")"
          else
            plan="$(bash scripts/checks/affected.sh --all)"
          fi
          echo "$plan"
          get() { printf '%s\n' "$plan" | sed -n "s/^$1=//p"; }
          {
            if [ -f Cargo.toml ]; then echo "cargo=true"; else echo "cargo=false"; fi
            if [ -f app/ferrohealth-ui-gallery/Cargo.toml ] && [ "$(get gallery)" = true ]; then
              echo "gallery=true"
            else
              echo "gallery=false"
            fi
            # GitHub runs at most five macOS jobs at once on this plan, so a
            # change that reaches one or two sets runs each console in two
            # jobs (every other page in one), and a wider change one job per set.
            get design | tr ' ' '\n' | jq -nRr '
              [inputs | select(length > 0)]
              | (length <= 2) as $halve
              | map(if $halve and . != "templates" then {set: ., part: "1/2"}, {set: ., part: "2/2"} else {set: ., part: ""} end)
              | "design=" + tojson'
          } | tee -a "$GITHUB_OUTPUT"

  # ---- Tier 2 ---------------------------------------------------------------
  fmt:
    name: rustfmt
    needs: detect
    if: github.event_name != 'merge_group' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: clippy (host and wasm32)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The library compiles under every render mode a console turns on
      # (.claude/rules/leptos-ui.md §2), so the browser target is linted
      # under hydrate and under csr.
      - run: cargo clippy -p ferrohealth-ui --lib --locked --target wasm32-unknown-unknown --features leptos/hydrate -- -D warnings
      - run: cargo clippy -p ferrohealth-ui --lib --locked --target wasm32-unknown-unknown --features leptos/csr -- -D warnings
      # The browser half builds at the lowest web-sys its manifest asks for,
      # so the library never moves a console's wasm-bindgen.
      - run: bash scripts/checks/browser-floor.sh
      - if: needs.detect.outputs.gallery == 'true'
        run: cargo clippy -p ferrohealth-ui-gallery --lib --locked --target wasm32-unknown-unknown -- -D warnings

  test:
    name: nextest (with the contrast test)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked
      # Every page and state has both images, and no other image is kept:
      # on the refresh pull request, a release pull request and a manual run,
      # since a feature pull request commits no screenshot.
      - name: The screenshot set is whole
        if: >-
          github.event_name == 'workflow_dispatch'
          || github.head_ref == 'chore/screenshots'
          || startsWith(github.head_ref, 'release/')
          || contains(github.event.pull_request.labels.*.name, 'screenshots')
        env:
          FERROUI_SCREENSHOT_GUARD: "1"
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_shot_has_its_light_and_dark_image)'

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        run: bash scripts/checks/advisory-exceptions.sh
      # A VEX statement whose published argument names the wrong dependency
      # path: compared with the graph cargo resolves, in both directions.
      - name: Every VEX statement names the real dependency path
        run: bash scripts/checks/vex-reachability.sh

  # The published Rust advisory VEX is exactly what deny.toml and
  # security/vex/rust-advisories.toml generate, and every hand-written
  # OpenVEX document is well formed. No specification governs the gate: our
  # own design, the one FerroEHR and FerroFED run.
  vex:
    name: vex
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml and the prose file are TOML, which jq cannot read. Pinned by
      # version and verified by checksum: this binary decides whether the gate
      # passes.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          yq --version
      - name: Every accepted advisory has a published VEX justification
        run: bash scripts/checks/vex-advisories.sh

  # The vendored Lucide set is whole: every listed icon and its licence, and
  # no file the list does not name.
  lucide:
    name: lucide
    needs: detect
    if: github.event_name != 'merge_group' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/vendor/lucide.sh --check

  # No cache: the dry run checks the bytes a publish would upload.
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo publish -p ferrohealth-ui --dry-run --locked

  crate-version-guard:
    name: crate-version-guard
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The version, the lock and the changelog agree
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  dependency-review:
    name: dependency-review
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- Tier 3 ---------------------------------------------------------------
  # The release site bundle, then in headless Chrome for Testing at the
  # pinned release, as two jobs side by side over a bundle each builds: the
  # bundle's size budget and path check with the journeys and the
  # painted-colour check, and the screenshot capture. A journey or a shot
  # fails on any error the browser logs. The screenshots are uploaded for
  # review.
  gallery:
    name: gallery (${{ matrix.part }})
    needs: detect
    if: needs.detect.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [journeys, capture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-leptos@0.3.11,wasm-bindgen@0.2.129,cargo-nextest
      - name: Install the Tailwind CSS CLI and wasm-opt
        run: |
          bash scripts/release/gallery-tools.sh "$RUNNER_TEMP/gallery-tools"
          echo "$RUNNER_TEMP/gallery-tools/bin" >> "$GITHUB_PATH"
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
          install-chromedriver: true
      - run: bash scripts/release/gallery-site.sh --release
      # The sizes go to the job summary; the step fails above the budget of
      # .claude/rules/leptos-ui.md §12.
      - if: matrix.part == 'journeys'
        run: bash scripts/checks/gallery-bundle.sh
      - if: matrix.part == 'journeys'
        run: bash scripts/checks/gallery-paths.sh
      - name: Run the journeys
        if: matrix.part == 'journeys'
        env:
          FERROUI_JOURNEYS: "1"
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery
      - name: Capture the screenshots
        if: matrix.part == 'capture'
        env:
          FERROUI_SCREENSHOTS: "1"
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_page_is_captured)'
      # On a release pull request every committed page image is compared
      # with its fresh capture by its pixels, so a release cannot go out on
      # images that no longer show the gallery (FerroUI #428; no
      # specification governs this: our own design).
      - name: The committed screenshots show what the gallery draws
        if: matrix.part == 'capture' && startsWith(github.head_ref, 'release/')
        env:
          FERROUI_SCREENSHOT_PIXELS: "1"
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_committed_screenshot_shows_what_a_fresh_capture_draws)'
      - if: matrix.part == 'capture'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-screenshots
          path: docs/screenshots/
          retention-days: 14

  # ---- Tier 4 ---------------------------------------------------------------
  # Every first-party file of the design library carries the SPDX lines.
  design-licence:
    name: design-licence
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/spdx.sh design scripts/checks/spdx.sh

  # The design pages of each set the change reaches, built and checked:
  # links, the BSN eleven-proof, plurals and one-sentence intros, then
  # overflow and broken words, hover stability, contrast, selects, popups
  # and forms, all read from one render of each page in headless Chrome at
  # the gallery's pinned release. macOS, because the approved renders and
  # every baseline.tsv were drawn with its system font, which the overflow
  # and broken-word checks measure.
  design:
    name: design (${{ matrix.set }}${{ matrix.part && format(' {0}', matrix.part) || '' }})
    needs: detect
    if: needs.detect.outputs.design != '[]'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.design) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
      - name: Build the pages and run every check
        env:
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          DESIGN_SET: ${{ matrix.set }}
          FERROUI_DESIGN_PART: ${{ matrix.part }}
        run: bash design/tools/check.sh "$DESIGN_SET"

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - comment-style
      - stray-literals
      - leptos-rules
      - todo-issues
      - contribution-licence
      - guards
      - detect
      - fmt
      - clippy
      - test
      - doc
      - cargo-deny
      - vex
      - lucide
      - publish-dry-run
      - crate-version-guard
      - dependency-review
      - gallery
      - design-licence
      - design
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
