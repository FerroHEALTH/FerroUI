# CI in three tiers (no specification governs this: our own design).
#
#   1. The workflow, shell and guard tier needs no Rust and runs on every
#      change.
#   2. The Rust tier runs when the workspace exists (the `detect` job looks
#      for the root Cargo.toml after checkout, which hashFiles() at `if:` time
#      cannot): fmt, clippy, nextest with the
#      contrast test, rustdoc, cargo-deny, the publish dry run.
#   3. The gallery tier runs when the change reaches the gallery: the gallery
#      built with cargo build, then the browser journeys in two parts and,
#      when the change can move a pixel, the screenshot capture in one job
#      per brand, in Chrome for Testing.
#   4. The design tier builds the console design library's pages (design/)
#      and runs its checks in headless Chrome, one job per design set the
#      change reaches.
#
# What a change reaches is scripts/checks/affected.sh's answer over the
# paths it touches (the `detect` job); a push to main and a manual run reach
# everything. A merge-group run leaves out the per-file lints (zizmor,
# actionlint, shellcheck, comment-style, todo-issues, rustfmt, lucide,
# design-licence): a pull request enters the queue only with `conclusion`
# green on its head, and the push to main runs them again over the merged
# tree. Every job that builds, tests or renders the merged tree runs in the
# queue.
#
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited` started a second run on the same commit, the
    # concurrency group cancelled the first, and its `conclusion` reported a
    # failure on the head commit (#377). The guards read their labels from
    # the API when they run, and pr-guards.yml re-runs the one a change
    # affects once this run completes.
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Tier 1 ---------------------------------------------------------------
  workflow-audit:
    name: zizmor
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: zizmor@1.31.1
      - name: Audit .github
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  workflow-lint:
    name: actionlint
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  shellcheck:
    name: shellcheck
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        run: bash scripts/release/milestone.sh --self-test
      - name: The crate version guard reads files past the pipe buffer and refuses a missing section
        run: bash scripts/checks/crate-version-guard.sh --self-test
      - name: The change classifier, the local gate and the Chrome lock pass their self-tests
        run: |
          bash scripts/checks/affected.sh --self-test
          bash scripts/fast.sh --self-test
          bash scripts/chrome-lock.sh --self-test

  comment-style:
    name: comment-style
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # No string a reader sees in a component outside the catalogs, in the
  # Rust and in the templates.
  stray-literals:
    name: stray-literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/stray-literals.sh crates/ferrohealth-ui/src crates/ferrohealth-ui/templates app/ferrohealth-ui-gallery/src

  # The markup keeps a console's policy at script-src 'self' and
  # style-src 'self': no style attribute or element, no inline script or
  # handler, no javascript: URL; with its self-test.
  markup-rules:
    name: markup-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/markup-rules.sh --self-test
      - run: bash scripts/checks/markup-rules.sh crates/ferrohealth-ui/src crates/ferrohealth-ui/templates app/ferrohealth-ui-gallery/src

  # The script modules within their budget, with no eval, no absolute URL
  # and no fetch outside the two documented wires; with its self-test.
  script-budget:
    name: script-budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/script-budget.sh --self-test
      - run: bash scripts/checks/script-budget.sh

  # Code is written once (.claude/rules/rust-style.md, #536): the duplicated
  # lines jscpd measures in the Rust, the script modules and the templates
  # may fall and never rise. jscpd runs from its official image, pinned by
  # digest in docs/VERSIONS.md, and the count and the key of every counted
  # block are committed beside the guard. A rise fails and names the new
  # blocks by both places; a fall fails until the count is lowered with
  # --update.
  duplication:
    name: duplication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Duplication ratchet self-test
        run: bash scripts/checks/duplication.sh --self-test
      - name: The duplicated lines have not risen or fallen
        run: bash scripts/checks/duplication.sh

  # A hand-written Rust file carries at most 800 lines, its inline tests
  # included (#536). A file over it on the day the guard landed stands in
  # scripts/checks/file-size.list with its length and may shrink and never
  # grow; a shrink fails until the entry is lowered, so the list only tightens.
  file-size:
    name: file-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File-size ratchet self-test
        run: bash scripts/checks/file-size.sh --self-test
      - name: No file over the budget or past its entry
        run: bash scripts/checks/file-size.sh

  # Every TODO(#N) names an open issue.
  todo-issues:
    name: todo-issues
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pending-work pointer names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh

  # The guards that keep parallel pull requests off each other's lines (no
  # specification governs them: our own design): every changelog fragment is
  # well formed and every module list is alphabetical. On a pull request, the
  # change adds a fragment and leaves [Unreleased] alone (`no-changelog`
  # waives the fragment), and commits no screenshot unless it is the refresh
  # pull request. Labels are read when the job runs, and pr-guards.yml re-runs
  # the job when `no-changelog` is added or removed (#377).
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The whole history of commits and trees, each old blob fetched when a
      # guard reads it: the screenshots of every release stay on the server (#497).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: The guards prove themselves over stub repositories
        run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
          bash scripts/checks/changelog-security.sh --self-test
          bash scripts/release/plan.sh --self-test
          bash scripts/checks/screenshot-paths.sh --self-test
          bash scripts/checks/mod-order.sh --self-test
      - run: bash scripts/release/changelog.sh --check
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8), on the
      # fragments assembled as the next release will carry them: every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason. The
      # release plan runs the same checks over the section it cuts.
      - name: The changelog the next release carries holds its structure and Security rules
        run: bash scripts/checks/changelog-unreleased.sh
      - run: bash scripts/checks/mod-order.sh
      - name: The pull request adds a fragment and commits no screenshot
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
          flag=()
          if grep -qx 'no-changelog' <<<"$labels"; then flag=(--no-changelog); fi
          bash scripts/checks/changelog-guard.sh "${flag[@]}" "$BASE" "$HEAD"
          if [ "$HEAD_REF" = "chore/screenshots" ] || grep -qx 'screenshots' <<<"$labels"; then
            echo "the refresh pull request: the screenshot guard runs in the test job"
          else
            bash scripts/checks/screenshot-paths.sh "$BASE" "$HEAD"
          fi

  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    outputs:
      cargo: ${{ steps.find.outputs.cargo }}
      gallery: ${{ steps.find.outputs.gallery }}
      capture: ${{ steps.find.outputs.capture }}
      states: ${{ steps.find.outputs.states }}
      gallery-matrix: ${{ steps.find.outputs.gallery-matrix }}
      design: ${{ steps.find.outputs.design }}
    steps:
      # Two commits: a pull request's checkout is its merge commit, whose
      # first parent is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          # One capture job per brand, in Brand::ALL's order; the gallery's
          # tests hold this list to the brands (the_ci_capture_runs_one_job_per_brand).
          CAPTURE_BRANDS: "ferrobridge ferrofed ferroehr ferroterm ferropix"
          JOURNEY_PARTS: "2"
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
              ;;
            merge_group)
              # The compare API lists at most 300 files; a longer list reaches everything.
              gh api "repos/$GH_REPO/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq '.files[].filename' > "$RUNNER_TEMP/changed"
              ;;
          esac
          if [ -f "$RUNNER_TEMP/changed" ] && [ "$(wc -l < "$RUNNER_TEMP/changed")" -lt 300 ]; then
            echo "changed paths:"
            sed 's/^/  /' "$RUNNER_TEMP/changed"
            plan="$(bash scripts/checks/affected.sh < "$RUNNER_TEMP/changed")"
          else
            plan="$(bash scripts/checks/affected.sh --all)"
          fi
          echo "$plan"
          get() { printf '%s\n' "$plan" | sed -n "s/^$1=//p"; }
          # The refresh and the release pull request, a pull request with the
          # `screenshots` label (which commits images, as the screenshot-path
          # guard allows it) and a manual run capture every page and state and
          # compare them with the committed images by their pixels, whatever
          # paths they touch.
          refresh=false
          case "$HEAD_REF" in chore/screenshots | release/*) refresh=true ;; esac
          # The labels are read when the step runs: `gh pr create --label`
          # adds them after the `opened` event, whose payload carries none,
          # and pr-guards.yml re-runs this job when the label comes later (#481).
          if [ "$EVENT" = pull_request ]; then
            labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
            if grep -qx 'screenshots' <<<"$labels"; then refresh=true; fi
          fi
          if [ "$EVENT" = workflow_dispatch ]; then refresh=true; fi
          gallery=false capture=false
          if [ -f app/ferrohealth-ui-gallery/Cargo.toml ]; then
            if [ "$(get gallery)" = true ] || [ "$refresh" = true ]; then gallery=true; fi
            if [ "$(get capture)" = true ] || [ "$refresh" = true ]; then capture=true; fi
          fi
          {
            if [ -f Cargo.toml ]; then echo "cargo=true"; else echo "cargo=false"; fi
            echo "gallery=$gallery"
            echo "capture=$capture"
            echo "states=$refresh"
            jq -nr --arg parts "$JOURNEY_PARTS" --arg brands "$CAPTURE_BRANDS" --argjson capture "$capture" '
              ($parts | tonumber) as $n
              | [range(1; $n + 1) | {name: "journeys \(.)/\($n)", part: "journeys", partition: "\(.)/\($n)", brand: ""}]
                + (if $capture then [$brands | split(" ")[] | {name: "capture \(.)", part: "capture", partition: "", brand: .}] else [] end)
              | "gallery-matrix=" + tojson'
            # GitHub runs at most five macOS jobs at once on this plan, so a
            # change that reaches one or two sets runs each console in two
            # jobs (every other page in one), and a wider change one job per set.
            get design | tr ' ' '\n' | jq -nRr '
              [inputs | select(length > 0)]
              | (length <= 2) as $halve
              | map(if $halve and . != "templates" then {set: ., part: "1/2"}, {set: ., part: "2/2"} else {set: ., part: ""} end)
              | "design=" + tojson'
          } | tee -a "$GITHUB_OUTPUT"

  # ---- Tier 2 ---------------------------------------------------------------
  fmt:
    name: rustfmt
    needs: detect
    if: github.event_name != 'merge_group' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A console that serves the assets itself builds the library without
      # its axum feature.
      - run: cargo clippy -p ferrohealth-ui --all-targets --locked --no-default-features -- -D warnings

  test:
    name: nextest (with the contrast test)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked
      # Every page and state has both images, and no other image is kept:
      # on the runs that capture the states (the refresh pull request, a
      # release pull request, the `screenshots` label and a manual run, the
      # `detect` job's `states`), since a feature pull request commits no
      # screenshot.
      - name: The screenshot set is whole
        if: needs.detect.outputs.states == 'true'
        env:
          FERROUI_SCREENSHOT_GUARD: "1"
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_shot_has_its_light_and_dark_image)'

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      - run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        run: bash scripts/checks/advisory-exceptions.sh
      # A VEX statement whose published argument names the wrong dependency
      # path: compared with the graph cargo resolves, in both directions.
      - name: Every VEX statement names the real dependency path
        run: |
          bash scripts/checks/vex-reachability.sh --self-test
          bash scripts/checks/vex-reachability.sh

  # The published Rust advisory VEX is exactly what deny.toml and
  # security/vex/rust-advisories.toml generate, and every hand-written
  # OpenVEX document is well formed. No specification governs the gate: our
  # own design, the one FerroEHR and FerroFED run.
  vex:
    name: vex
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml and the prose file are TOML, which jq cannot read. Pinned by
      # version and verified by checksum: this binary decides whether the gate
      # passes.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          yq --version
      - name: Every accepted advisory has a published VEX justification
        run: |
          bash scripts/checks/vex-advisories.sh --self-test
          bash scripts/checks/vex-advisories.sh

  # The vendored Lucide set is whole: every listed icon and its licence, and
  # no file the list does not name.
  lucide:
    name: lucide
    needs: detect
    if: github.event_name != 'merge_group' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/vendor/lucide.sh --check

  # No cache: the dry run checks the bytes a publish would upload.
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo publish -p ferrohealth-ui --dry-run --locked

  crate-version-guard:
    name: crate-version-guard
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The whole history of commits and trees, each old blob fetched when a
      # guard reads it: the screenshots of every release stay on the server (#497).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: The version, the lock and the changelog agree
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  dependency-review:
    name: dependency-review
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- Tier 3 ---------------------------------------------------------------
  # The gallery in headless Chrome for Testing at the pinned release, in
  # parallel jobs that each build the gallery: the journeys in two parts,
  # and, when the change can move a pixel (the `capture` output of
  # detect), the screenshot capture in one job per brand. A journey or a shot
  # fails on any error the browser logs. Each capture job uploads its brand's
  # screenshots, and gallery-screenshots merges them into one artifact.
  gallery:
    name: gallery (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.gallery-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
          install-chromedriver: true
      # The gallery is a server and its pages' script modules are the
      # library's: a cargo build is the whole build.
      - run: cargo build --locked -p ferrohealth-ui-gallery
      # Every test of the gallery's package, split by count into the parts
      # (nextest, --partition), so each part opens its share of the browsers.
      - name: Run the journeys
        if: matrix.part == 'journeys'
        env:
          FERROUI_JOURNEYS: "1"
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          PARTITION: ${{ matrix.partition }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery --partition "count:$PARTITION"
      - name: Capture the screenshots
        if: matrix.part == 'capture'
        env:
          FERROUI_SCREENSHOTS: "1"
          FERROUI_SCREENSHOT_BRAND: ${{ matrix.brand }}
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_page_is_captured)'
      # On the refresh and the release pull request and a manual run the states are captured
      # too, so the artifact holds the whole set the pull request commits,
      # and every committed page and state image is compared with its fresh
      # capture by its pixels, so neither commits images that no longer show
      # the gallery (FerroUI #428; no specification governs this: our own
      # design).
      - name: Capture the states
        if: matrix.part == 'capture' && needs.detect.outputs.states == 'true'
        env:
          FERROUI_SCREENSHOTS: "1"
          FERROUI_SCREENSHOT_BRAND: ${{ matrix.brand }}
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_state_is_captured)'
      - name: The committed screenshots show what the gallery draws
        if: matrix.part == 'capture' && needs.detect.outputs.states == 'true'
        env:
          FERROUI_SCREENSHOT_PIXELS: "1"
          FERROUI_SCREENSHOT_BRAND: ${{ matrix.brand }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_committed_screenshot_shows_what_a_fresh_capture_draws)'
      # The artifact is kept when the pixel check fails too: it holds the
      # captures the refresh and the release pull request commit, since a
      # capture is compared only with one made on the same runner image. Each
      # job uploads its own brand's images; the first brand's job also the
      # images of no brand.
      - if: always() && matrix.part == 'capture'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-screenshots-${{ matrix.brand }}
          path: |
            docs/screenshots/${{ matrix.brand }}/
            docs/screenshots/states/${{ matrix.brand }}/
            ${{ matrix.brand == 'ferrobridge' && 'docs/screenshots/*.png' || '!docs/screenshots/*.png' }}
          retention-days: 1

  # The brands' screenshots as the one `gallery-screenshots` artifact the
  # refresh and the release pull request download (docs/release.md).
  gallery-screenshots:
    name: gallery-screenshots
    needs: [detect, gallery]
    if: always() && needs.detect.outputs.capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-screenshots
          pattern: gallery-screenshots-*
          retention-days: 14
          delete-merged: true

  # ---- Tier 4 ---------------------------------------------------------------
  # Every first-party file of the design library carries the SPDX lines.
  design-licence:
    name: design-licence
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/spdx.sh design scripts/checks/spdx.sh

  # The design pages of each set the change reaches, built and checked:
  # links, the BSN eleven-proof, plurals and one-sentence intros, then
  # overflow and broken words, hover stability, contrast, selects, popups
  # and forms, all read from one render of each page in headless Chrome at
  # the gallery's pinned release. macOS, because the approved renders and
  # every baseline.tsv were drawn with its system font, which the overflow
  # and broken-word checks measure.
  design:
    name: design (${{ matrix.set }}${{ matrix.part && format(' {0}', matrix.part) || '' }})
    needs: detect
    if: needs.detect.outputs.design != '[]'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.design) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
      - name: Build the pages and run every check
        env:
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          DESIGN_SET: ${{ matrix.set }}
          FERROUI_DESIGN_PART: ${{ matrix.part }}
        run: bash design/tools/check.sh "$DESIGN_SET"

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - comment-style
      - stray-literals
      - markup-rules
      - script-budget
      - duplication
      - file-size
      - todo-issues
      - guards
      - detect
      - fmt
      - clippy
      - test
      - doc
      - cargo-deny
      - vex
      - lucide
      - publish-dry-run
      - crate-version-guard
      - dependency-review
      - gallery
      - gallery-screenshots
      - design-licence
      - design
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
