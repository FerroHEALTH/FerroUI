# CI in three tiers (no specification governs this: our own design).
#
#   1. The workflow, shell and guard tier needs no Rust and runs on every
#      change.
#   2. The Rust tier runs when the workspace exists (the `detect` job looks
#      for the root Cargo.toml after checkout, which hashFiles() at `if:` time
#      cannot): fmt, clippy on the host and on wasm32, nextest with the
#      contrast test, rustdoc, cargo-deny, the publish dry run.
#   3. The gallery tier runs when the gallery exists: the release site bundle
#      with its size budget and path check, then the browser journeys and the
#      screenshot capture in Chrome for Testing.
#   4. The design tier builds the console design library's pages (design/)
#      and runs its checks in headless Chrome, one job per design set.
#
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` re-runs the contribution-licence guard when the box is ticked.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Tier 1 ---------------------------------------------------------------
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: zizmor@1.31.1
      - name: Audit .github
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        run: bash scripts/release/milestone.sh --self-test

  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # No string a reader sees in a component outside the catalogs
  # (.claude/rules/leptos-ui.md §13).
  stray-literals:
    name: stray-literals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/stray-literals.sh crates/ferrohealth-ui/src app/ferrohealth-ui-gallery/src

  # Every TODO(#N) names an open issue.
  todo-issues:
    name: todo-issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pending-work pointer names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh

  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the
  # template's checkbox. Bots are skipped: a bot cannot accept terms.
  contribution-licence:
    name: contribution-licence
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/checks/contribution-licence.sh

  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.find.outputs.cargo }}
      gallery: ${{ steps.find.outputs.gallery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then echo "cargo=true"; else echo "cargo=false"; fi >> "$GITHUB_OUTPUT"
          if [ -f app/ferrohealth-ui-gallery/Cargo.toml ]; then echo "gallery=true"; else echo "gallery=false"; fi >> "$GITHUB_OUTPUT"

  # ---- Tier 2 ---------------------------------------------------------------
  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: clippy (host and wasm32)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The library compiles under every render mode a console turns on
      # (.claude/rules/leptos-ui.md §2), so the browser target is linted
      # under hydrate and under csr.
      - run: cargo clippy -p ferrohealth-ui --lib --locked --target wasm32-unknown-unknown --features leptos/hydrate -- -D warnings
      - run: cargo clippy -p ferrohealth-ui --lib --locked --target wasm32-unknown-unknown --features leptos/csr -- -D warnings
      # The browser half builds at the lowest web-sys its manifest asks for,
      # so the library never moves a console's wasm-bindgen.
      - run: bash scripts/checks/browser-floor.sh
      - if: needs.detect.outputs.gallery == 'true'
        run: cargo clippy -p ferrohealth-ui-gallery --lib --locked --target wasm32-unknown-unknown -- -D warnings

  test:
    name: nextest (with the contrast test)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The vendored Lucide set is whole: every listed icon and its licence, and
  # no file the list does not name.
  lucide:
    name: lucide
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/vendor/lucide.sh --check

  # No cache: the dry run checks the bytes a publish would upload.
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo publish -p ferrohealth-ui --dry-run --locked

  crate-version-guard:
    name: crate-version-guard
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The version, the lock and the changelog agree
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  dependency-review:
    name: dependency-review
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- Tier 3 ---------------------------------------------------------------
  gallery-bundle:
    name: gallery (site bundle and budget)
    needs: detect
    if: needs.detect.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-leptos@0.3.11,wasm-bindgen@0.2.129
      # Pinned and checked against their SHA-256, so cargo-leptos downloads
      # neither itself.
      - name: Install the Tailwind CSS CLI and wasm-opt
        run: |
          bash scripts/release/gallery-tools.sh "$RUNNER_TEMP/gallery-tools"
          echo "$RUNNER_TEMP/gallery-tools/bin" >> "$GITHUB_PATH"
      - run: bash scripts/release/gallery-site.sh --release
      # The sizes go to the job summary; the step fails above the budget of
      # .claude/rules/leptos-ui.md §12.
      - run: bash scripts/checks/gallery-bundle.sh
      - run: bash scripts/checks/gallery-paths.sh

  # The journeys, the painted-colour check and the screenshot capture, in
  # headless Chrome for Testing at the pinned release. A journey fails on
  # any error the browser logs. The screenshots are uploaded for review.
  gallery-browser:
    name: gallery (browser)
    needs: detect
    if: needs.detect.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-leptos@0.3.11,wasm-bindgen@0.2.129,cargo-nextest
      - name: Install the Tailwind CSS CLI and wasm-opt
        run: |
          bash scripts/release/gallery-tools.sh "$RUNNER_TEMP/gallery-tools"
          echo "$RUNNER_TEMP/gallery-tools/bin" >> "$GITHUB_PATH"
      - name: Install Chrome and chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
          install-chromedriver: true
      - run: bash scripts/release/gallery-site.sh --release
      - name: Run the journeys
        env:
          FERROUI_JOURNEYS: "1"
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery
      - name: Capture the screenshots
        env:
          FERROUI_SCREENSHOTS: "1"
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FERROUI_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo nextest run --locked -p ferrohealth-ui-gallery -E 'test(every_page_is_captured)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-screenshots
          path: docs/screenshots/
          retention-days: 14

  # ---- Tier 4 ---------------------------------------------------------------
  # Every first-party file of the design library carries the SPDX lines.
  design-licence:
    name: design-licence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/spdx.sh design scripts/checks/spdx.sh

  # The design pages of each set, built and checked: links, the BSN
  # eleven-proof, plurals and one-sentence intros, then overflow and broken
  # words, hover stability, contrast and selects in headless Chrome at the
  # gallery's pinned release. macOS, because the approved renders and every
  # baseline.tsv were drawn with its system font, which the overflow and
  # broken-word checks measure.
  design:
    name: design (${{ matrix.set }})
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        set: [templates, ferrobridge, ferroehr, ferrofed, ferropix, ferroterm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.79
      - name: Build the pages and run every check
        env:
          FERROUI_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          DESIGN_SET: ${{ matrix.set }}
        run: bash design/tools/check.sh "$DESIGN_SET"

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - workflow-audit
      - workflow-lint
      - shellcheck
      - comment-style
      - stray-literals
      - todo-issues
      - contribution-licence
      - detect
      - fmt
      - clippy
      - test
      - doc
      - cargo-deny
      - lucide
      - publish-dry-run
      - crate-version-guard
      - dependency-review
      - gallery-bundle
      - gallery-browser
      - design-licence
      - design
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
