name: Bug report
description: Report a defect in a FerroUI component, the stylesheet or a theme.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A maintainer sets the priority during
        triage. Do not use this form for a security vulnerability; see
        [SECURITY.md](https://github.com/FerroHEALTH/FerroUI/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The component, the props, the gallery page, and what you did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. A screenshot helps; name the brand and the theme.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0, or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and assistive technology
      description: The browser and version, and any screen reader or zoom level.
    validations:
      required: false
