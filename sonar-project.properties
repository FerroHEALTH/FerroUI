# SonarQube Cloud project scope (#614). The analysis is advisory: it gates no
# merge, and a finding is acted on by hand in a normal change.
sonar.projectKey=FerroHEALTH_FerroUI
sonar.organization=ferrohealth
sonar.projectName=FerroUI
sonar.sourceEncoding=UTF-8

# Every hand-written tree, the scripts, workflows and hooks included.
sonar.sources=.

# Excluded, one reason each:
#   **/target/**: build output.
#   crates/ferrohealth-ui/vendor/**: the Lucide outlines, vendored verbatim
#     under their ISC License by scripts/vendor/lucide.sh.
#   design/out/**: the ignored renders of design/tools.
#   design/consoles/**, design/themes/**, the library helpers in
#     design/templates/ and design/tools/: the copy of the design folders the
#     design is reviewed in, which design/tools/sync.py writes and a revised
#     design replaces whole (design/README.md, Sync a revised design), so a
#     finding there is fixed in the design folders. The repository's own
#     tools and design/templates/console.py stay analyzed.
#   images and fonts: binary, nothing to analyze.
sonar.exclusions=\
  **/target/**,\
  crates/ferrohealth-ui/vendor/**,\
  design/out/**,\
  design/consoles/**,\
  design/themes/**,\
  design/templates/common.py,\
  design/templates/data.py,\
  design/templates/pages.py,\
  design/templates/catalog.py,\
  design/tools/tpl.py,\
  design/tools/parts.py,\
  design/tools/pg_about.py,\
  **/*.png,\
  **/*.ico,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.webp,\
  **/*.woff,\
  **/*.woff2

# Coverage: sonar.yml imports the lcov report of the instrumented workspace
# tests. The trees no unit test executes stay analyzed for findings and are
# left out of the coverage measure:
#   scripts/**, .claude/**: shell, run by CI and the hooks.
#   design/**: the design library's Python page builders and checks.
#   crates/ferrohealth-ui/scripts/**: the browser modules, which the gallery
#     journeys run in Chrome, where no lcov run can see them.
#   **/tests/**: the test code itself.
sonar.rust.lcov.reportPaths=lcov.info
sonar.coverage.exclusions=\
  scripts/**,\
  .claude/**,\
  design/**,\
  crates/ferrohealth-ui/scripts/**,\
  **/tests/**

