# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The only advisory gate: it reads the RustSec database cargo audit does and
# adds yanked, licences, bans and sources.

[advisories]
version = 2
yanked = "deny"
# An exception is dated and names the event that deletes it.
ignore = [
  # 2026-10-18: paste is unmaintained, a compile-time proc-macro under the
  # Leptos 0.8 family with no runtime surface. Deleted when no Leptos crate in
  # the lock depends on paste. https://rustsec.org/advisories/RUSTSEC-2024-0436
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; a compile-time proc-macro under the Leptos 0.8 family, with no runtime surface" },
]

[licenses]
version = 2
# Dev-dependencies are compiled here and in CI, so their licences are read too.
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on and its Apache 2.0
# Change License admits. A licence joins the day a dependency needs it.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE).
exceptions = [
  { allow = ["BUSL-1.1"], crate = "ferrohealth-ui" },
  { allow = ["BUSL-1.1"], crate = "ferrohealth-ui-gallery" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
