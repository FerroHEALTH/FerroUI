[package]
name = "ferrohealth-ui-gallery"
description = "The gallery of the FerroHEALTH UI components: every component in every product theme, light and dark, rendered on the server, its behaviour in the library's plain script modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrohealth-ui-gallery"
path = "src/main.rs"

[dependencies]
# The gallery is an axum service drawing every page on the server with the
# library's parts and its own Askama templates; it builds with cargo build.
ferrohealth-ui = { path = "../../crates/ferrohealth-ui" }
askama.workspace = true
# The pseudo-locale's catalog, a Fluent loader over the library's English.
fluent-templates.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { workspace = true, features = ["set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
thirtyfour.workspace = true
rustix.workspace = true
png.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "fs"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
