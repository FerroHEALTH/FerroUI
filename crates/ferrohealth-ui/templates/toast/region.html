<div class="fui-toasts" role="status" aria-live="polite" aria-label="{{ region }}" data-fui="toast">
<template><div class="fui-toast">{{ placeholder }}<div class="fui-toast-text"><strong></strong><span></span></div><button type="button" class="fui-icon-button" aria-label="{{ dismiss }}" title="{{ dismiss }}" data-fui-dismiss>{{ x }}</button></div>{% for (tone, glyph) in glyphs %}<span data-tone="{{ tone }}">{{ glyph }}</span>{% endfor %}</template>
{% for toast in toasts %}<div class="fui-toast {{ toast.tone }}"{% if let Some(role) = toast.role %} role="{{ role }}"{% endif %}>{{ toast.glyph }}<div class="fui-toast-text"><strong>{{ toast.title }}</strong>{% if let Some(line) = toast.line %}<span>{{ line }}</span>{% endif %}</div>{% if let Some(action) = toast.action %}<a href="{{ action.href }}" class="{{ action_class }}" data-fui-action>{{ action.label }}</a>{% endif %}<details open class="fui-toast-close"><summary class="fui-icon-button" aria-label="{{ dismiss }}" title="{{ dismiss }}">{{ x }}</summary></details><button type="button" class="fui-icon-button" aria-label="{{ dismiss }}" title="{{ dismiss }}" data-fui-dismiss hidden>{{ x }}</button></div>{% endfor %}
</div>
