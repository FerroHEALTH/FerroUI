<div class="fui-toasts" role="status" aria-live="polite" aria-label="{{ region }}" data-fui="toast">
<template><div class="fui-toast"><span class="fui-toast-glyph"></span><div class="fui-toast-text"><strong></strong><span class="fui-toast-line"></span></div><details open class="fui-toast-close"><summary class="fui-icon-button" aria-label="{{ dismiss }}" title="{{ dismiss }}">{{ x }}</summary></details><button type="button" class="fui-icon-button fui-toast-dismiss" aria-label="{{ dismiss }}" title="{{ dismiss }}" hidden>{{ x }}</button></div>{% for (tone, glyph) in glyphs %}<span data-tone="{{ tone }}">{{ glyph }}</span>{% endfor %}</template>
{% for toast in toasts %}<div class="fui-toast {{ toast.tone }}"{% if let Some(role) = toast.role %} role="{{ role }}"{% endif %}><span class="fui-toast-glyph">{{ toast.glyph }}</span><div class="fui-toast-text"><strong>{{ toast.title }}</strong>{% if let Some(line) = toast.line %}<span class="fui-toast-line">{{ line }}</span>{% endif %}</div>{% if let Some(action) = toast.action %}<a href="{{ action.href }}" class="{{ action_class }} fui-toast-action">{{ action.label }}</a>{% endif %}<details open class="fui-toast-close"><summary class="fui-icon-button" aria-label="{{ dismiss }}" title="{{ dismiss }}">{{ x }}</summary></details><button type="button" class="fui-icon-button fui-toast-dismiss" aria-label="{{ dismiss }}" title="{{ dismiss }}" hidden>{{ x }}</button></div>{% endfor %}
</div>
