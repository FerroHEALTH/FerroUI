{% block button %}<span data-fui="copy"{% match source %}{% when CopySource::Text(text) %} data-fui-copy-text="{{ text }}"{% when CopySource::Element(id) %} data-fui-copy-element="{{ id }}"{% when CopySource::Lines { id, final_break } %} data-fui-copy-lines="{{ id }}"{% if *final_break %} data-fui-final-break{% endif %}{% endmatch %} class="fui-copy"><button type="button" id="{{ id }}" hidden class="{{ class }}"><span data-fui-ready>{{ copy_glyph }}{{ label }}</span><span data-fui-done hidden>{{ check_glyph }}{{ copied }}</span></button><span role="status" data-said-copied="{{ said_copied }}" data-said-refused="{{ said_refused }}" class="fui-sr-only"></span><span aria-hidden="true" hidden class="fui-copy-refused">{{ refused }}</span></span>{% endblock %}
{% block key_hint %}<span class="fui-key-hint is-text"><code>{{ key }}</code></span><button type="button" aria-label="{{ label }}" title="{{ title }}" hidden data-fui="copy" data-fui-copy-text="{{ key }}" class="fui-key-hint"><code>{{ key }}</code><span data-fui-ready>{{ copy_glyph }}</span><span data-fui-done hidden>{{ check_glyph }}</span></button><span role="status" data-said-copied="{{ copied }}" data-said-refused="{{ refused }}" class="fui-sr-only"></span>{% endblock %}
