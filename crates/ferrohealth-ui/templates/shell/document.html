<!doctype html>
<html lang="{{ lang }}" data-theme="{{ theme }}" data-density="{{ density }}" data-motion="{{ motion }}" data-hints="{{ hints }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ stylesheet }}">
<link rel="stylesheet" href="{{ theme_file }}">
{{ head }}
<script type="module" src="{{ loader }}"{% if let Some(nonce) = nonce %} nonce="{{ nonce }}"{% endif %}></script>
</head>
<body>
{{ body }}
</body>
</html>
