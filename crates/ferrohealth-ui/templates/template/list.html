{% block chips %}<div class="fui-filter-chips"><span class="fui-small fui-muted">{{ showing }}</span>{% for (chip, name) in chips %}<span class="fui-filter-chip">{{ chip.label }} <a href="{{ chip.remove }}" aria-label="{{ name }}">{{ x_small }}</a></span>{% endfor %}<a href="{{ clear }}" class="fui-button fui-button-ghost fui-button-small">{{ x }}{{ clear_words }}</a></div>{% endblock %}
{% block card %}<section aria-label="{{ name }}" class="fui-card fui-panel fui-worklist fui-list-card"><div class="fui-panel-head fui-list-head"><h2 class="fui-card-title"><span>{{ title }}</span></h2>{% if let Some(order) = order %}<p class="fui-sort-note">{{ order }}</p>{% endif %}<div class="fui-actions">{{ actions }}</div></div>{{ body }}{{ foot }}</section>{% endblock %}
