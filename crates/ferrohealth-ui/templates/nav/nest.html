<ul aria-label="{{ label }}" class="fui-nav-tree"><li><a href="{{ parent.href }}" aria-current="{{ parent_current }}" title="{{ parent.label }}" class="fui-nav-entry fui-nav-parent">{{ parent.dot }}{{ parent.word }}<span class="fui-nav-badge"><span aria-hidden="true">{{ count }}</span><span class="fui-sr-only">{{ count_words }}</span></span></a>{% if !children.is_empty() %}<ul class="fui-nav-children">{% for child in children %}<li><a href="{{ child.href }}"{% if child.current %} aria-current="page"{% endif %} title="{{ child.label }}" class="fui-nav-entry fui-nav-child">{{ child.dot }}{{ child.word }}</a></li>{% endfor %}{% if let Some(all) = all %}<li><a href="{{ parent.href }}" class="fui-nav-entry fui-nav-child fui-nav-all"><span class="fui-nav-word">{{ all }}</span></a></li>{% endif %}</ul>{% endif %}</li></ul>
