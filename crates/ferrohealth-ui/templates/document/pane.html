<section id="{{ id }}" aria-label="{{ label }}" class="fui-document">{{ choice }}<div role="group" aria-label="{{ switch_label }}" class="fui-segmented fui-document-switch">{% for choice in views %}<a href="#{{ id }}-{{ choice.view.key() }}" data-view="{{ choice.view.key() }}"{% if choice.view == opening %} aria-current="true"{% endif %} class="fui-segment">{{ choice.words }}</a>{% endfor %}</div><div data-shown="{{ opening.key() }}" data-fui="document" class="fui-document-views"><div id="{{ id }}-highlighted" data-view="highlighted" class="fui-document-view">{{ highlighted }}</div><div id="{{ id }}-raw" data-view="raw" class="fui-document-view"><div role="region" aria-label="{{ raw_label }}" tabindex="0" class="fui-code-panel fui-scroll-cue"><pre id="{{ id }}-text">{{ raw }}</pre></div></div>{% if let Some(body) = rendered %}<div id="{{ id }}-rendered" data-view="rendered" class="fui-document-view"><div class="fui-document-rendered">{{ body }}</div></div>{% endif %}</div>{{ copy }}</section>
