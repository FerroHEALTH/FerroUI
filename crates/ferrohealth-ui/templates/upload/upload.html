<div data-fui="upload" data-fui-words="{{ words }}" data-fui-accept="{{ accept }}" data-fui-max="{{ max_bytes }}" class="fui-upload"><div id="{{ id }}-drop" class="fui-drop"><span class="fui-drop-glyph">{{ glyph }}</span><p data-upload="words" class="fui-drop-words">{{ invite }}</p><label for="{{ id }}-file" class="fui-button fui-button-secondary fui-button-small">{{ folder }}{{ choose }}</label><input id="{{ id }}-file" type="file" name="{{ id }}-file" accept="{{ accept }}" class="fui-sr-only"><p class="fui-small">{{ rule }}</p></div><p role="status" data-upload="read" hidden class="fui-drop-state">{{ file }}<span></span></p><p role="alert" data-upload="lossy" hidden class="fui-drop-state fui-drop-state-warn">{{ warn }}<span></span></p><p role="alert" data-upload="refused" hidden class="fui-drop-state fui-drop-state-refused">{{ alert }}<span></span></p><div class="fui-field"><label for="{{ id }}-text" class="fui-label">{{ label }}</label>{{ editor }}</div>{% if let Some(busy) = busy %}<p role="status" class="fui-spinner"><span aria-hidden="true" class="fui-spinner-ring"></span>{{ busy }}</p>{% endif %}{% if let Some(refusal) = refusal %}<div role="alert" class="fui-alert">{{ refusal }}</div>{% endif %}</div>
