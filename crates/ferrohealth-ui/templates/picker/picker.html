{% block picker %}<div data-fui="picker" class="fui-field fui-picker"><label for="{{ id }}-choice" class="fui-label">{{ choose_label }}</label><select id="{{ id }}-choice"{% if let Some(described) = described %} aria-describedby="{{ described }}"{% endif %} class="{{ select }}"><option value=""{% if selection == Selection::Empty %} selected{% endif %}>{{ empty_word }}</option>{% for (choice, words) in choices %}<option value="{{ choice }}" title="{{ choice }}"{% if selection == Selection::Listed(choice.clone()) %} selected{% endif %}>{{ words }}</option>{% endfor %}<option value="" data-other=""{% if selection == Selection::Other %} selected{% endif %}>{{ other_word }}</option></select><div data-fui-picker-input class="fui-field"><label for="{{ id }}" class="fui-label">{{ label }}</label><input id="{{ id }}" name="{{ name }}"{% if let Some(described) = described %} aria-describedby="{{ described }}"{% endif %} autocomplete="off" spellcheck="false" value="{{ value }}" class="{{ input }}"></div>{{ help }}</div>{% endblock %}
{% block pick_or_type %}<div data-fui="picker" class="fui-field"><div data-side="pick"{% if typing %} hidden{% endif %} class="fui-field">{{ picker }}</div><div data-side="type"{% if !typing %} hidden{% endif %} class="fui-field"><label for="{{ typed_id }}" class="fui-label">{{ label }}</label>{{ typed }}</div>{{ after }}</div>{% endblock %}
