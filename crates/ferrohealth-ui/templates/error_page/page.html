<div class="fui-status-page"><span class="fui-empty-glyph">{{ glyph }}</span><p class="fui-status-page-code">{{ line }}</p><h1>{{ title }}</h1><p>{{ body }}</p>{% if let Some(hint) = hint %}<p class="fui-small fui-muted">{{ hint }}</p>{% endif %}<div class="fui-actions">{{ ways }}</div>{% if let Some(detail) = detail %}<details class="fui-disclosure"><summary>{{ detail_words }}</summary><div><dl class="fui-facts"><dt>{{ time_words }}</dt><dd>{{ detail.time }}</dd><dt>{{ request_words }}</dt><dd><code>{{ detail.request_id }}</code></dd></dl></div></details>{% endif %}</div>
