{% block field %}<div data-fui="editor" data-language="{{ language }}"{% if detect %} data-fui-detect{% endif %} data-marks="{{ marks }}"{% if let Some(current) = current %} data-current="{{ current }}"{% endif %} class="fui-editor{% if invalid %} is-invalid{% endif %}"><div class="fui-editor-stack is-static"><pre aria-hidden="true" class="fui-editor-layer">{{ layer }}</pre><textarea id="{{ id }}" name="{{ id }}"{% if let Some(label) = label %} aria-label="{{ label }}"{% endif %}{% if invalid %} aria-invalid="true"{% endif %} autocomplete="off" autocapitalize="off" spellcheck="false" wrap="soft"{% if let Some(placeholder) = placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if !editable %} readonly{% endif %} class="fui-editor-input">{{ text }}</textarea></div></div>{% endblock %}
{% block panel %}<section data-fui-words="{{ words }}"{% if is_new %} data-fui-new{% endif %}{% if let Some(opened) = opened %} data-fui-opened="{{ opened }}"{% endif %} class="fui-card fui-panel fui-mapping-editor{% if blank %} is-empty{% endif %}"><div class="fui-editor-bar"><span data-fui-lead="{{ lead }}">{{ bar }}</span><div class="fui-actions">{{ tools }}</div></div>{{ field }}<div class="fui-editor-status"><span data-fui-position>{{ position }}</span>{% for fact in facts %}<span>{{ fact }}</span>{% endfor %}<span data-fui-state{% if dirty %} class="fui-editor-dirty"{% endif %}>{{ state }}</span><span role="status" class="fui-sr-only">{% if let Some(said) = said %}{{ said }}{% endif %}</span>{% if let Some(end) = end %}<span class="fui-editor-status-end">{{ end }}</span>{% endif %}</div></section>{% endblock %}
