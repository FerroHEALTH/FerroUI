<div data-fui="combobox" data-fui-name="{{ name }}" data-fui-placeholder="{{ placeholder }}" data-fui-no-match="{{ no_match }}" data-fui-more="{{ more }}"{% if let Some(param) = remote %} data-fui-remote="{{ param }}" data-fui-query="{{ query }}"{% endif %} class="fui-field fui-combobox"><label for="{{ id }}" class="fui-label">{{ label }}</label><select id="{{ id }}" name="{{ name }}"{% if let Some(described) = described_by %} aria-describedby="{{ described }}"{% endif %} class="{{ select }}"><option value=""{% if selected.is_none() %} selected{% endif %}>{{ placeholder }}</option>{% for option in options %}<option value="{{ option.value }}"{% if let Some(detail) = option.detail %} data-detail="{{ detail }}"{% endif %}{% if selected.as_deref() == Some(option.value.as_str()) %} selected{% endif %}>{{ option.label }}</option>{% endfor %}</select><template data-fui-icons><span data-icon="check">{{ check }}</span></template></div>
