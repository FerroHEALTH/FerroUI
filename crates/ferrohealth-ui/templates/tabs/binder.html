<div class="{{ sheet }}">
{% if let Some(select) = select %}<form class="fui-tabs-select" method="get" data-fui="tabs"><label class="fui-tabs-select-field"><span class="fui-sr-only">{{ label }}</span><select class="{{ select.select_class }}" disabled>{% for (href, words, chosen, lang) in select.choices %}<option value="{{ href }}"{% if *chosen %} selected{% endif %}{% if let Some(lang) = lang %} lang="{{ lang }}"{% endif %}>{{ words }}</option>{% endfor %}</select></label><button type="submit" class="{{ select.button_class }}">{{ select.go }}</button></form>{% endif %}
<nav class="fui-tabs" aria-label="{{ label }}" data-ferroui-tab-keys="" data-fui-tab-keys="" data-fui="tabs keep">{% for tab in tabs %}<a href="{{ tab.href }}" class="fui-tab"{% if tab.current %} aria-current="page"{% endif %} data-tab="{{ tab.key }}"{% if let Some(panel) = tab.panel %} data-fui-panel="{{ panel }}"{% endif %}>{{ tab.label }}{% if let Some((number, words)) = tab.count %}<span class="fui-tab-count"><span aria-hidden="true">{{ number }}</span><span class="fui-sr-only">{{ words }}</span></span>{% endif %}{% if tab.draft %}<span class="fui-tab-draft">{{ draft }}</span>{% endif %}</a>{% endfor %}</nav>
<div class="fui-tab-panel">{{ panel }}</div>
</div>
