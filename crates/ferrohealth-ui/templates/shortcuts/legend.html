<p class="fui-muted">{{ intro }}</p><div class="fui-shortcuts">{% for group in groups %}<section aria-labelledby="{{ legend_id }}-group-{{ loop.index }}" class="fui-shortcuts-group"><h3 id="{{ legend_id }}-group-{{ loop.index }}">{{ group.title }}</h3><dl class="fui-shortcuts-list">{% for (keys, does) in group.rows %}<dt>{{ keys }}</dt><dd>{{ does }}</dd>{% endfor %}</dl></section>{% endfor %}{% if let Some(go) = go %}<section aria-labelledby="{{ legend_id }}-go" data-fui-go="{{ go.lead }}" class="fui-shortcuts-group"><h3 id="{{ legend_id }}-go">{{ go.title }}</h3><dl class="fui-shortcuts-list">{% for (keys, href, key, does) in go.rows %}<dt>{{ keys }}</dt><dd><a href="{{ href }}" data-fui-go-key="{{ key }}">{{ does }}</a></dd>{% endfor %}</dl></section>{% endif %}</div>
