<form role="search" method="{% if post %}post{% else %}get{% endif %}" action="{{ action }}"{% if busy %} aria-busy="true"{% endif %} data-fui="search" data-fui-words="{{ words }}"{% if let Some(key) = shortcut %} data-fui-shortcut="{{ key }}"{% endif %}{% if let Some(suggest) = suggest %} data-fui-suggest="{{ suggest }}" data-fui-from="{{ from }}"{% endif %}{% if let Some(signed_out) = signed_out %} data-fui-signed-out="{{ signed_out }}"{% endif %} class="fui-search"><label for="{{ id }}" class="fui-sr-only">{{ label }}</label><div class="fui-search-field"><span class="fui-search-glyph">{% if busy %}<span aria-hidden="true" class="fui-spinner-ring"></span>{% else %}{{ glyph }}{% endif %}</span><input id="{{ id }}" name="{{ name }}" type="search" class="fui-input" placeholder="{{ placeholder }}" value="{{ value }}" autocomplete="off" spellcheck="false"{% if let Some(key) = shortcut %} aria-keyshortcuts="{{ key }}"{% endif %}{% if disabled.is_some() %} aria-describedby="{{ id }}-why"{% endif %}{% if let Some(reason) = disabled %} title="{{ reason }}" disabled{% endif %}>{% if let Some(key) = shortcut %}<kbd aria-hidden="true" class="fui-kbd fui-search-hint">{{ key }}</kbd>{% endif %}</div><button type="submit" aria-label="{{ submit.text() }}"{% if disabled.is_some() || busy %} disabled{% endif %} class="fui-search-submit">{{ glyph }}<span class="fui-search-word">{{ submit }}</span></button>{% if let Some(reason) = disabled %}<span id="{{ id }}-why" class="fui-sr-only">{{ reason }}</span>{% endif %}{% if suggest.is_some() %}<div id="{{ id }}-panel" hidden class="fui-search-results"><div role="listbox" id="{{ id }}-results" aria-label="{{ answer.text() }}" class="fui-search-results-list"></div></div><span role="status" class="fui-sr-only"></span>{% endif %}<template data-fui-icons>{% for (name, svg) in icons %}<span data-icon="{{ name }}">{{ svg }}</span>{% endfor %}</template></form>
