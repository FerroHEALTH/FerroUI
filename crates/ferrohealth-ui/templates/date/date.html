{% block field %}<div data-fui="date" data-fui-date="{{ config }}" class="fui-field fui-date-field"><label for="{{ id }}" class="fui-label">{{ label }} <span class="fui-muted">{{ format_hint }}</span></label><div class="fui-input-group fui-date"><input id="{{ id }}" name="{{ name }}" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="{{ format }}" value="{{ value }}"{% if error.is_some() %} aria-invalid="true"{% endif %} aria-describedby="{{ described }}" class="fui-input"><button type="button" aria-label="{{ needs_script }}" aria-haspopup="dialog" aria-expanded="false" aria-controls="{{ id }}-picker" disabled class="{{ inner_button }}">{{ calendar }}</button></div>{% if let Some(help) = help %}<p id="{{ help_id }}" class="fui-help">{{ help }}</p>{% endif %}<p id="{{ error_id }}" aria-live="polite"{% if error.is_none() %} hidden{% endif %} class="{{ error_class }}">{% if let Some(error) = error %}{{ error }}{% endif %}</p>{{ icons }}</div>{% endblock %}
{% block range %}<div data-fui="date_range" data-fui-range="{{ config }}" class="fui-date-field"><div class="fui-date-range-fields">{% for end in ends %}<div class="fui-field"><label for="{{ end.id }}" class="fui-label">{{ end.label }} <span class="fui-muted">{{ format_hint }}</span></label><input id="{{ end.id }}" name="{{ end.name }}" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="{{ format }}" value="{{ end.value }}" class="fui-input"></div>{% endfor %}</div><button type="button" hidden aria-haspopup="dialog" aria-expanded="false" aria-controls="{{ id }}-picker" class="{{ secondary }}">{{ calendar }}<span data-fui-summary>{{ summary }}</span></button>{{ icons }}</div>{% endblock %}
