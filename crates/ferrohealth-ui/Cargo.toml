[package]
name = "ferrohealth-ui"
description = "The shared UI components of the FerroHEALTH consoles: server-rendered Askama components, role tokens, plain script modules, a highlighter and one table model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["askama", "ui", "components", "design-system", "accessibility"]
categories = ["gui", "web-programming"]
# The templates, the stylesheet, the brand themes, the script modules, the
# string catalogs and the vendored icon outlines travel with the crate.
include = [
  "src/**",
  "templates/**",
  "css/**",
  "themes/**",
  "scripts/**",
  "locales/**",
  "vendor/**",
  "tests/**",
  "README.md",
]

[features]
default = ["axum"]
# The asset router a console mounts (`serve`): the stylesheet, the themes
# and the script modules under one versioned path.
axum = ["dep:axum", "dep:http"]

[dependencies]
askama.workspace = true
serde.workspace = true
serde_json.workspace = true
fluent-templates.workspace = true
intl-memoizer.workspace = true
form_urlencoded.workspace = true
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
