[package]
name = "ferrohealth-ui"
description = "The shared UI components of the FerroHEALTH consoles: Leptos view functions and widgets, role tokens, a highlighter and one table model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["leptos", "ui", "components", "design-system", "accessibility"]
categories = ["gui", "wasm", "web-programming"]
# The stylesheet, the brand themes, the string catalogs and the vendored icon outlines travel with
# the crate, so a console reads them from the registry checkout or from the
# constants of `ferrohealth_ui::style`.
include = ["src/**", "css/**", "themes/**", "locales/**", "vendor/**", "tests/**", "README.md"]

# No render-mode feature: the library compiles under `csr`, `ssr` and
# `hydrate` alike, whichever the console's own leptos dependency turns on
# (features unify per build), and defines no server function. A console
# hydrates the whole page and splits its code by route (`docs/consoles.md`).
[dependencies]
leptos.workspace = true
leptos_router.workspace = true
serde.workspace = true
fluent-templates.workspace = true
intl-memoizer.workspace = true

# The widgets' browser code, compiled for the browser alone. Each asks for
# the lowest release leptos 0.8.22 resolves with (web-sys 0.3.85 pins
# wasm-bindgen 0.2.108), not the workspace pin, so a console's own lock picks
# its wasm-bindgen and its CLI; `scripts/checks/browser-floor.sh` builds the
# library at these floors. The wasm-bindgen crate is reached through leptos.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", default-features = false, features = [
  "Attr",
  "Blob",
  "Clipboard",
  "DataTransfer",
  "DocumentFragment",
  "DomRect",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FormData",
  "FocusEvent",
  "FocusOptions",
  "Headers",
  "History",
  "HtmlAnchorElement",
  "HtmlDetailsElement",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "MutationObserver",
  "MutationObserverInit",
  "NamedNodeMap",
  "NodeList",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "SubmitEvent",
  "Url",
  "UrlSearchParams",
  "Window",
] }

# The tests render the views to HTML on the host, which the `ssr` feature
# draws; a dev-dependency reaches the test build alone.
[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
hydration_context.workspace = true
# A day crosses to the browser as JSON; its unit tests read it back.
serde_json.workspace = true

[lints]
workspace = true
